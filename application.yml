server:
  port: 8080

spring:
  application:
    name: ewm-main-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ewm_main
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

logging:
  level:
    ru.practicum.ewm: DEBUG